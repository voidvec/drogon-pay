name: Windows CI

# MIGRATION WINDOW: superseded by ci.yml + _build-test.yml. Both pipelines run
# side by side until ci.yml has produced one fully green run on the same commit
# as this file; then this workflow is deleted.
on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

env:
  BUILD_TYPE: Release

jobs:
  build-and-test:
    name: windows-build-and-test
    runs-on: windows-2022
    # Cold Conan cache builds drogon/openssl from source, which can take a while
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Install Conan
        run: |
          pip install conan
          conan profile detect --force

      # --- Conan dependency cache ---
      # Drogon 1.9.13, OpenSSL 3.5.7 and friends come from Conan now; cache the
      # package store so they are only built from source when the lockfile changes.
      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: ${{ runner.os }}-conan2-${{ hashFiles('conanfile.py', 'conan.lock') }}
          restore-keys: |
            ${{ runner.os }}-conan2-

      - name: Install dependencies (Conan)
        run: conan install . --output-folder=build/windows-msvc -s build_type=${{env.BUILD_TYPE}} -s compiler.cppstd=17 --build=missing

      - name: Configure (cmake --preset)
        run: cmake --preset windows-msvc -DDROGON_PAY_WERROR=ON

      - name: Build (cmake --build --preset)
        run: cmake --build --preset windows-msvc

      # --- Test infrastructure ---
      # GitHub-hosted Windows runners do not support service containers, so we
      # use the PostgreSQL bundled with the runner image and install Redis-
      # compatible Memurai via Chocolatey to mirror the Linux CI services.
      - name: Start PostgreSQL (runner built-in)
        run: |
          $pgService = Get-Service -Name "postgresql*" | Select-Object -First 1
          if (-not $pgService) { Write-Error "No PostgreSQL service found on runner"; exit 1 }
          Set-Service -InputObject $pgService -StartupType Manual
          Start-Service -InputObject $pgService
          & "$env:PGBIN\pg_isready.exe" -h 127.0.0.1
          if ($LASTEXITCODE -ne 0) { Write-Error "PostgreSQL is not ready"; exit 1 }

      - name: Install Redis (Memurai)
        run: |
          choco install memurai-developer -y --no-progress
          # Memurai installs as an auto-started Windows service on port 6379
          $ready = $false
          for ($i = 1; $i -le 15; $i++) {
            if ((Test-NetConnection 127.0.0.1 -Port 6379 -WarningAction SilentlyContinue).TcpTestSucceeded) { $ready = $true; break }
            Write-Host "  Redis not ready yet (attempt $i/15)..."
            Start-Sleep -Seconds 2
          }
          if (-not $ready) { Write-Error "Redis (Memurai) did not become ready on port 6379"; exit 1 }

      - name: Initialize Database
        run: |
          # Runner image ships PostgreSQL with superuser postgres / password root
          $env:PGPASSWORD = "root"
          & "$env:PGBIN\psql" -h 127.0.0.1 -U postgres -c "CREATE USER test WITH PASSWORD '123456';"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & "$env:PGBIN\psql" -h 127.0.0.1 -U postgres -c "CREATE DATABASE pay_test OWNER test;"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $env:PGPASSWORD = "123456"
          & "$env:PGBIN\psql" -h 127.0.0.1 -U test -d pay_test -f sql/001_init_pay_tables.sql
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & "$env:PGBIN\psql" -h 127.0.0.1 -U test -d pay_test -f sql/002_add_indexes.sql
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Test
        working-directory: ${{github.workspace}}/build/windows-msvc
        env:
          PAY_REDIS_PASSWORD: ""
          PAY_DB_HOST: "127.0.0.1"
          PAY_REDIS_HOST: "127.0.0.1"
          PAY_DB_PASSWORD: "123456"
          PAY_API_KEY: "test_key_123456"
        run: ctest -C ${{env.BUILD_TYPE}} --output-on-failure --timeout 180

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-logs
          path: |
            ${{github.workspace}}/build/windows-msvc/Testing/
            ${{github.workspace}}/logs/
          retention-days: 7
