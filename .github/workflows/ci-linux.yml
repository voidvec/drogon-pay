name: Linux CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:
    inputs:
      legacy-source-build:
        description: "Run the legacy build-Drogon-from-source path (rollback safety net, kept for one release cycle)"
        type: boolean
        default: false

env:
  BUILD_TYPE: Release
  # Only used by the legacy source-build job below.
  DROGON_VERSION: "v1.9.13"

jobs:
  static-analysis:
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # .clang-format uses options introduced in clang-format 16+ (e.g.
      # BraceWrapping.AfterControlStatement: Always, AfterCaseLabel: true),
      # and AlignAfterOpenBracket: BlockIndent formatting of long conditions
      # differs between clang-format point releases (v17 vs v22 disagree on
      # 15 files). Pin CI to the same clang-format-22 developers run locally
      # so the gate stops generating spurious drift between versions.
      - name: Install clang-format-22
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/llvm.gpg
          echo "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-22 main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y clang-format-22
          # NOTE: do not rely on update-alternatives here — on ubuntu-22.04 the
          # system /usr/bin/clang-format (v14) is not an alternatives symlink, so
          # the check step invokes clang-format-22 by its versioned name instead.

      - name: Architecture guard
        run: python3 scripts/check_architecture.py

      - name: Docs drift guard
        run: python3 scripts/check_docs_drift.py

      # Hard gate: format-the-tree commit resolved all pre-existing drift.
      # models/ is generated code and excluded (same scope as
      # .clang-format-ignore). Version pin lives in
      # scripts/clang_format.py (PINNED_MAJOR), not in this workflow.
      - name: clang-format check
        env:
          CLANG_FORMAT_BIN: clang-format-22
        run: python3 scripts/clang_format.py --check

      - name: Emoji detection
        run: |
          echo "Checking for emoji in source files..."
          if grep -rPn '[\x{1F000}-\x{1FFFF}]' libs/ examples/pay-server/ tests/ --include='*.h' --include='*.cc'; then
            echo "ERROR: Emoji found in source files"
            exit 1
          fi
          echo "No emoji found."

      - name: Hardcoded secrets detection
        run: |
          echo "Checking for hardcoded secrets..."
          if grep -rn -E '(passwd|password|secret)\s*[:=]\s*"[^_${}][^"]{2,}"' libs/ examples/pay-server/ tests/ \
               --include='*.h' --include='*.cc' --include='*.json' \
               | grep -v '__env_var' | grep -v '.example' | grep -v 'test_key_'; then
            echo "ERROR: Possible hardcoded secret found"
            exit 1
          fi
          echo "No hardcoded secrets found."

      - name: CoroMapper usage detection
        run: |
          echo "Checking for CoroMapper usage (excluding auto-generated ORM models)..."
          if grep -rn 'CoroMapper' libs/ examples/pay-server/ tests/ --include='*.h' --include='*.cc' --exclude-dir=models; then
            echo "ERROR: CoroMapper usage detected outside models/"
            exit 1
          fi
          echo "No CoroMapper usage found outside models/."

      - name: Old Plugin API detection
        run: |
          echo "Checking for old Plugin API usage in tests..."
          if grep -rn 'plugin.*->.*method.*req.*callback' tests/ --include='*.cc'; then
            echo "ERROR: Old Plugin API usage detected in tests"
            exit 1
          fi
          echo "No old Plugin API usage found."

  # Two-tier clang-tidy policy (see scripts/clang_tidy_gate.py): .clang-tidy
  # stays advisory for agents/devs; this job enforces the PROMOTED_CHECKS
  # batch as a HARD gate via --warnings-as-errors. Configure-only: tidy
  # parses sources straight from compile_commands.json, no object build.
  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install Conan
        run: |
          pip install conan
          conan profile detect --force

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: ${{ runner.os }}-conan2-${{ hashFiles('conanfile.py', 'conan.lock') }}
          restore-keys: |
            ${{ runner.os }}-conan2-

      - name: Install dependencies (Conan)
        run: conan install . --output-folder=build/linux-release -s build_type=${{env.BUILD_TYPE}} -s compiler.cppstd=17 --build=missing

      - name: Configure (cmake --preset, no build)
        run: cmake --preset linux-release

      # Same apt.llvm.org repo and major as the clang-format-22 install in
      # static-analysis, so local gate measurements and CI see one check set.
      - name: Install clang-tidy-22
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/llvm.gpg
          echo "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-22 main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y clang-tidy-22

      - name: clang-tidy hard gate (promoted checks)
        env:
          CLANG_TIDY_BIN: clang-tidy-22
        run: python3 scripts/clang_tidy_gate.py

  # Primary path: Conan-managed dependencies + CMake presets, mirroring the
  # Windows CI and local developer workflow. Drogon/OpenSSL/jsoncpp come from
  # the lockfile-pinned Conan graph instead of an ad-hoc source build.
  build-and-test:
    name: linux-build-and-test
    runs-on: ubuntu-22.04
    # Cold Conan cache builds drogon/openssl from source, which can take a while
    timeout-minutes: 90

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: 123456
          POSTGRES_DB: pay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install Conan
        run: |
          pip install conan
          conan profile detect --force

      # --- Conan dependency cache ---
      # Same policy as ci-windows.yml: cache the package store so drogon and
      # friends are only rebuilt from source when the lockfile changes.
      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: ${{ runner.os }}-conan2-${{ hashFiles('conanfile.py', 'conan.lock') }}
          restore-keys: |
            ${{ runner.os }}-conan2-

      - name: Install dependencies (Conan)
        run: conan install . --output-folder=build/linux-release -s build_type=${{env.BUILD_TYPE}} -s compiler.cppstd=17 --build=missing

      - name: Configure (cmake --preset)
        run: cmake --preset linux-release -DDROGON_PAY_WERROR=ON

      - name: Build (cmake --build --preset)
        run: cmake --build --preset linux-release -j $(nproc)

      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y postgresql-client redis-tools

      - name: Wait for services
        run: |
          echo "Waiting for Postgres..."
          for i in $(seq 1 15); do
            PGPASSWORD=123456 pg_isready -h localhost -U test && break
            echo "  Postgres not ready yet (attempt $i/15)..."
            sleep 2
          done
          echo "Waiting for Redis..."
          for i in $(seq 1 15); do
            redis-cli -h localhost ping && break
            echo "  Redis not ready yet (attempt $i/15)..."
            sleep 2
          done

      - name: Initialize Database
        env:
          PGPASSWORD: 123456
        run: |
          psql -h localhost -U test -d pay_test -f sql/001_init_pay_tables.sql
          psql -h localhost -U test -d pay_test -f sql/002_add_indexes.sql

      - name: Test
        working-directory: ${{github.workspace}}/build/linux-release
        env:
          PAY_REDIS_PASSWORD: ""
          PAY_DB_HOST: "127.0.0.1"
          PAY_REDIS_HOST: "127.0.0.1"
          PAY_DB_PASSWORD: "123456"
          PAY_API_KEY: "test_key_123456"
        run: ctest -C ${{env.BUILD_TYPE}} --output-on-failure --timeout 120

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-test-logs
          path: |
            ${{github.workspace}}/build/linux-release/Testing/
            ${{github.workspace}}/logs/
          retention-days: 7

  # --- Legacy rollback path (kept for one release cycle) ---
  # Pre-Conan pipeline that builds Drogon from source with apt-provided
  # dependencies. Trigger manually via workflow_dispatch with
  # legacy-source-build=true if the Conan path regresses. Remove after the
  # Conan path has been stable for a full release cycle.
  build-and-test-legacy:
    name: linux-build-and-test-legacy
    if: github.event_name == 'workflow_dispatch' && inputs.legacy-source-build
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: 123456
          POSTGRES_DB: pay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install Drogon dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            gcc \
            g++ \
            cmake \
            libjsoncpp-dev \
            uuid-dev \
            libpq-dev \
            libssl-dev \
            zlib1g-dev \
            libhiredis-dev \
            redis-tools

      - name: Build Drogon
        run: |
          git clone --depth 1 --branch ${{ env.DROGON_VERSION }} https://github.com/drogonframework/drogon
          cd drogon
          git submodule update --init --recursive
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DBUILD_EXAMPLES=OFF -DBUILD_MYSQL=OFF
          make -j$(nproc)

      - name: Install Drogon
        run: |
          cd drogon/build
          sudo make install

      - name: Install test dependencies
        run: |
          sudo apt-get install -y \
            postgresql-client \
            redis-tools \
            python3 \
            python3-pip

      - name: Configure Project CMake
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DCMAKE_CXX_STANDARD=17 -DBUILD_TESTS=ON -DCMAKE_PREFIX_PATH=/usr/local

      - name: Build
        run: cmake --build build --config ${{env.BUILD_TYPE}}

      - name: Wait for services
        run: |
          echo "Waiting for Postgres..."
          for i in $(seq 1 15); do
            PGPASSWORD=123456 pg_isready -h localhost -U test && break
            echo "  Postgres not ready yet (attempt $i/15)..."
            sleep 2
          done
          echo "Waiting for Redis..."
          for i in $(seq 1 15); do
            redis-cli -h localhost ping && break
            echo "  Redis not ready yet (attempt $i/15)..."
            sleep 2
          done

      - name: Initialize Database
        env:
          PGPASSWORD: 123456
        run: |
          psql -h localhost -U test -d pay_test -f sql/001_init_pay_tables.sql
          psql -h localhost -U test -d pay_test -f sql/002_add_indexes.sql

      - name: Test
        working-directory: ${{github.workspace}}/build
        env:
          PAY_REDIS_PASSWORD: ""
          PAY_DB_HOST: "127.0.0.1"
          PAY_REDIS_HOST: "127.0.0.1"
          PAY_DB_PASSWORD: "123456"
          PAY_API_KEY: "test_key_123456"
        run: ctest -C ${{env.BUILD_TYPE}} --output-on-failure --timeout 120

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-legacy-test-logs
          path: |
            ${{github.workspace}}/build/Testing/
            ${{github.workspace}}/logs/
          retention-days: 7
