name: Conan Package

# Consumer-facing smoke gate (Phase 4): `conan create` builds the drogon-pay
# recipe and runs test_package (a minimal find_package(DrogonPay) host that
# loads PayPlugin and asserts its routes are reachable). Deliberately NOT a
# required check yet - it will be promoted once it has proven stable.
#
# MIGRATION WINDOW: superseded by the sdk-smoke gate in ci.yml, which runs the
# same conan create on Linux as well as Windows. This file is deleted once that
# pipeline has one fully green run alongside it.
on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  conan-create:
    runs-on: windows-2022
    # Cold Conan cache builds drogon/openssl from source, which can take a while
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Install Conan
        run: |
          pip install conan
          conan profile detect --force

      # Same cache key scheme as ci-windows.yml so the two workflows share
      # the dependency store.
      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: ${{ runner.os }}-conan2-${{ hashFiles('conanfile.py', 'conan.lock') }}
          restore-keys: |
            ${{ runner.os }}-conan2-

      - name: conan create (recipe + test_package)
        run: conan create . --build=missing -s build_type=Release -s compiler.cppstd=17
