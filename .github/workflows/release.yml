name: Release

# Tag-driven release pipeline: a `v*` tag must prove it is a real release
# (version declared consistently + CHANGELOG section written) before any
# build time is spent, then re-validate the packaged library the way an
# external consumer uses it, and only then publish a GitHub Release whose
# body is that CHANGELOG section.
on:
  push:
    tags:
      - "v*"

# Least privilege: only `publish` writes. Checking out a tag and running a
# consumer smoke need read access, and giving every job `contents: write` is how
# a compromised build step gets release-modifying rights it never needed.
permissions:
  contents: read

jobs:
  # Cheap, instant gate first: fail the release before a Conan build can burn
  # an hour discovering the tag does not match the tree.
  version-check:
    runs-on: ubuntu-22.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Asserts the tag equals the version declared in CMakeLists.txt /
      # conanfile.py / pay-admin package.json AND that CHANGELOG.md already
      # carries a `## [x.y.z]` section. Missing section = hard fail, so the
      # publish step below can rely on it existing.
      - name: Version sync + changelog section
        run: python3 scripts/check_version_sync.py --tag "$GITHUB_REF_NAME"

  # Consumer-view validation, from the same reusable workflow the RELEASE gate
  # of ci.yml uses — the release path is not a second, weaker definition of
  # "this package works" (the old copy here only ran Windows-only and never
  # exercised the plugin routes).
  sdk-smoke:
    needs: version-check
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runs_on: ubuntu-22.04
          - platform: windows
            runs_on: windows-2022
    uses: ./.github/workflows/_sdk-smoke.yml
    with:
      platform: ${{ matrix.platform }}
      runs_on: ${{ matrix.runs_on }}
      timeout_minutes: 120

  publish:
    needs: sdk-smoke
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Extract the CHANGELOG section for this tag (e.g. tag v1.0.0 ->
      # "## [1.0.0]" block) to use as the release body. version-check above has
      # already proven the section exists; index() rather than a regex keeps a
      # version's dots literal, and the -s test means a silently-empty extraction
      # fails the job instead of publishing a notes-less release.
      - name: Extract changelog section
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            BEGIN { want = "## [" ver "]" }
            index($0, want) == 1 { grab = 1; print; next }
            grab && /^## \[/ { exit }
            grab { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "release_notes.md is empty: CHANGELOG.md has no '## [$VERSION]' heading" >&2
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release_notes.md
