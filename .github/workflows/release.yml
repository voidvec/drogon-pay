name: Release

# Tag-driven release pipeline: a `v*` tag must prove it is a real release
# (version declared consistently + CHANGELOG section written) before any
# build time is spent, then re-validate the packaged library the way an
# external consumer uses it, and only then publish a GitHub Release whose
# body is that CHANGELOG section.
on:
  push:
    tags:
      - "v*"

# Least privilege: only `publish` writes. Checking out a tag and running a
# consumer smoke need read access, and giving every job `contents: write` is how
# a compromised build step gets release-modifying rights it never needed.
permissions:
  contents: read

jobs:
  # Cheap, instant gate first: fail the release before a Conan build can burn
  # an hour discovering the tag does not match the tree.
  version-check:
    runs-on: ubuntu-22.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Asserts the tag equals the version declared in CMakeLists.txt /
      # conanfile.py / pay-admin package.json AND that CHANGELOG.md already
      # carries a `## [x.y.z]` section. Missing section = hard fail, so the
      # publish step below can rely on it existing.
      - name: Version sync + changelog section
        run: python3 scripts/check_version_sync.py --tag "$GITHUB_REF_NAME"

  # A tag is the one ref no branch rule protects. The ruleset's required
  # contexts gate merges into `master`, and a tag is never merged, so before
  # this job existed `git tag v1.2.3 <any commit> && git push --tags` released
  # whatever that commit happened to be — including one no test ever ran, or one
  # that only ever lived on an abandoned branch. So: prove the tagged commit is
  # on master's history, then wait for the five contexts the merge pipeline
  # reports for it. sdk-smoke below still re-runs the consumer smoke; "green on
  # master" and "installs the way a consumer builds it" are claims about
  # different artifacts, and this job cannot substitute for either.
  ci-gate:
    needs: version-check
    runs-on: ubuntu-22.04
    # Must exceed DEADLINE_MINUTES below. A job that hits the runner's ceiling is
    # cancelled with no output from the loop, so it reports "a timeout happened"
    # where the script would have reported *which* context never went green —
    # the difference between an operator fixing a drifted check name and guessing.
    timeout-minutes: 135
    permissions:
      contents: read
      checks: read

    env:
      # FAST is absent on purpose: MAIN and RELEASE both `need` it, so a green
      # build-test already carries static-analysis and clang-tidy on the same
      # commit. These are the contexts the pipeline really reports, suffix
      # included — the bare names went away with the legacy per-platform
      # workflows, and an `unreported` line below is what a stale name looks
      # like.
      REQUIRED_CHECKS: |
        linux-build-and-test / build-test
        windows-build-and-test / build-test
        macos-build / build-test
        sdk-smoke-linux / sdk-smoke
        sdk-smoke-windows / sdk-smoke
      # The merge pipeline is a serial FAST -> MAIN -> RELEASE chain, and one
      # measured pass of it took 32 minutes from push to the last green context
      # (clang-tidy alone held FAST for 15), with per-leg job timeouts of 90 and
      # 120 minutes above that. Two hours covers the observed path and leaves
      # room for a cold Conan cache without letting a drifted check name stall a
      # release indefinitely.
      DEADLINE_MINUTES: 120
      # A commit with no check runs at all will never grow them: a multi-commit
      # push runs CI only on its tip, so an interior master commit has no
      # pipeline to wait for. Bail on that after five minutes instead of two
      # hours, with a message that says which situation the operator is in.
      EARLY_BAIL_SECONDS: 300
      POLL_SECONDS: 30

    steps:
      - name: Wait for the merge pipeline on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # TAG_NAME arrives from the event payload and ends up inside an API
          # path, so it must look exactly like a version tag here. The shape is
          # deliberately as strict as `check_version_sync.py --tag`, which
          # accepts three numeric segments and rejects prerelease or build
          # suffixes, so nothing path-shaped can reach the URL.
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::refusing unexpected tag name: $TAG_NAME" >&2
            exit 1
          fi

          # The commits endpoint dereferences annotated tags, which is what this
          # needs: a tag object's own SHA carries no check runs.
          SHA=$(gh api "repos/$REPOSITORY/commits/$TAG_NAME" --jq .sha)
          echo "tag $TAG_NAME -> commit $SHA"

          # compare/<base>...<sha> answers "behind" or "identical" exactly when
          # <sha> is already inside the base branch's history, which is the
          # containment test the API offers. The call is guarded explicitly
          # because a failure inside a command substitution does not trip
          # `set -e`, and a 403 or 404 must not be reported as a policy decision.
          # `master` is hardcoded because the ruleset and the trunk are named
          # that in this repository; a default branch rename would make this fail
          # loudly, not release unmerged commits.
          if ! relation=$(gh api "repos/$REPOSITORY/compare/master...$SHA" --jq .status); then
            echo "::error::could not compare $SHA against master" >&2
            exit 1
          fi
          case "$relation" in
            behind|identical) ;;
            *)
              echo "::error::commit $SHA is not on master (compare reports $relation): a release must ship a merged commit" >&2
              exit 1
              ;;
          esac

          start=$(date +%s)
          deadline=$(( start + DEADLINE_MINUTES * 60 ))
          early_deadline=$(( start + EARLY_BAIL_SECONDS ))
          while :; do
            if ! runs=$(gh api "repos/$REPOSITORY/commits/$SHA/check-runs" --paginate \
                          --jq '.check_runs[] | "\(.id)\t\(.name)\t\(.status)\t\(.conclusion // "-")"'); then
              echo "::error::could not read check runs for $SHA" >&2
              exit 1
            fi

            # Nothing has ever reported against this commit. Waiting cannot help.
            if [ -z "$runs" ] && [ "$(date +%s)" -ge "$early_deadline" ]; then
              echo "::error::commit $SHA has no check runs at all; tag a commit the merge pipeline actually ran on (a multi-commit push runs CI only on its tip)" >&2
              exit 1
            fi

            pending=''
            failed=''
            while IFS= read -r name; do
              [ -n "$name" ] || continue
              # One verdict per name, taken from the highest check-run id. The
              # endpoint accumulates every run ever reported for the commit —
              # re-runs, and a second workflow_dispatch over the same SHA — and
              # the newest id is the one that describes the attempt made last.
              # Requiring all siblings to be green would let a stale `cancelled`
              # lock the release forever, and no re-run of the green suite could
              # clear it.
              state=$(printf '%s\n' "$runs" | awk -F'\t' -v want="$name" '
                $2 == want && (!seen || $1 + 0 > best) { seen = 1; best = $1 + 0; st = $3; co = $4 }
                END {
                  if (!seen)                     print "unreported"
                  else if (st != "completed")    print "pending"
                  else if (co != "success")      print "failed"
                  else                           print "green"
                }')
              case "$state" in
                green) ;;
                pending)    pending="${pending:+$pending; }${name}: still running" ;;
                unreported) pending="${pending:+$pending; }${name}: no check run on this commit" ;;
                failed)     failed="${failed:+$failed; }${name}: did not succeed" ;;
              esac
            done <<< "$REQUIRED_CHECKS"

            # Annotations stay on one line: a workflow-command data value may not
            # contain a raw newline, so a multi-line list would be cut off at the
            # first line in the check UI and survive only in the raw log.
            if [ -n "$failed" ]; then
              echo "::error::the merge pipeline is red on $SHA: $failed" >&2
              exit 1
            fi
            if [ -z "$pending" ]; then
              echo "Merge pipeline is green on $SHA; releasing."
              break
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::gave up after ${DEADLINE_MINUTES}m waiting for: $pending" >&2
              echo "A 'no check run on this commit' line means either the run is" >&2
              echo "still queued or the required name has drifted from what the" >&2
              echo "pipeline reports; see the check-name contract in AGENTS.md." >&2
              exit 1
            fi
            echo "Waiting on: $pending"
            sleep "$POLL_SECONDS"
          done

  # Consumer-view validation, from the same reusable workflow the RELEASE gate
  # of ci.yml uses — the release path is not a second, weaker definition of
  # "this package works" (the old copy here only ran Windows-only and never
  # exercised the plugin routes).
  sdk-smoke:
    needs: [version-check, ci-gate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runs_on: ubuntu-22.04
          - platform: windows
            runs_on: windows-2022
    uses: ./.github/workflows/_sdk-smoke.yml
    with:
      platform: ${{ matrix.platform }}
      runs_on: ${{ matrix.runs_on }}
      timeout_minutes: 120

  publish:
    needs: sdk-smoke
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Extract the CHANGELOG section for this tag (e.g. tag v1.0.0 ->
      # "## [1.0.0]" block) to use as the release body. version-check above has
      # already proven the section exists; index() rather than a regex keeps a
      # version's dots literal, and the -s test means a silently-empty extraction
      # fails the job instead of publishing a notes-less release.
      - name: Extract changelog section
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            BEGIN { want = "## [" ver "]" }
            index($0, want) == 1 { grab = 1; print; next }
            grab && /^## \[/ { exit }
            grab { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "release_notes.md is empty: CHANGELOG.md has no '## [$VERSION]' heading" >&2
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release_notes.md
