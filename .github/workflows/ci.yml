name: CI

# Single entry point for the merge pipeline. Three gates, chained by
# `needs` so a cheap failure never buys an expensive one:
#
#   FAST    static-analysis  (source-only guards, no compiler, 10 min)
#           clang-tidy       (configure-only; runs in parallel with the above)
#      |
#      v
#   MAIN    build-test       (_build-test.yml x {linux, windows, macos})
#      |
#      v
#   RELEASE sdk-smoke        (_sdk-smoke.yml x {linux, windows}, conan create)
#
# Both FAST jobs feed MAIN on purpose. A check that nothing depends on still
# turns red, but red on an unrequired check merges anyway, so tidy's promoted
# batch would be advisory in practice; the `needs` edge is what makes it a
# blocker, independent of which contexts the ruleset happens to require.
#
# Check-name contract: the branch ruleset requires exactly
# `linux-build-and-test / build-test`, `windows-build-and-test / build-test`
# and `macos-build / build-test`. The suffix is not decoration — a job that
# calls a reusable workflow with `uses:` reports its check as
# `<this job's name> / <name the called workflow gives its own job>`, so
# `matrix.check_name` fixes only the first half. The second half is `build-test`
# because _build-test.yml declares `jobs: build-test:` with no `name:` key.
# Change either half, or delete a workflow file that reported one, and the
# ruleset goes on requiring a context that nothing reports: merge protection
# does not lift, it inverts into a permanent stall, and `gh pr checks` never lists a
# required check that has no run, so the PR reads all-green while
# `mergeStateStatus` stays BLOCKED. Diff both sides with:
#   gh api repos/:owner/:repo/rulesets/<id> --jq '.rules[]
#     | select(.type=="required_status_checks")
#     | .parameters.required_status_checks[].context'
#   gh api repos/:owner/:repo/commits/<sha>/check-runs --jq '.check_runs[].name'
#
# The legacy ci-linux / ci-windows / ci-macos / conan-create copies this pipeline
# supersedes are deleted: run 35441152813 produced one fully green pass of this
# chain (FAST -> MAIN -> both sdk-smoke legs) side by side with all four legacy
# checks on the same commit, and `conan create` is now smoke-tested on Linux as
# well as Windows at PR time, which the legacy copy never did.
# `secrets-scan.yml` and `deploy.yml` stay independent on purpose.

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release

# Declared rather than inherited: every job here reads the checkout and writes
# nothing back to the repository, so the token should never hold more than that
# even if the organisation default changes underneath us.
permissions:
  contents: read

jobs:
  # --- FAST gate --------------------------------------------------------------
  # Everything that can reject a patch without compiling a single translation
  # unit. Name kept from ci-linux.yml because contributors and docs cite it.
  static-analysis:
    name: static-analysis
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # .clang-format uses options introduced in clang-format 16+ (e.g.
      # BraceWrapping.AfterControlStatement: Always, AfterCaseLabel: true),
      # and AlignAfterOpenBracket: BlockIndent formatting of long conditions
      # differs between clang-format point releases (v17 vs v22 disagree on
      # 15 files). Pin CI to the same clang-format-22 developers run locally
      # so the gate stops generating spurious drift between versions.
      - name: Install clang-format-22
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/llvm.gpg
          echo "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-22 main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y clang-format-22
          # NOTE: do not rely on update-alternatives here — on ubuntu-22.04 the
          # system /usr/bin/clang-format (v14) is not an alternatives symlink, so
          # the check step invokes clang-format-22 by its versioned name instead.

      - name: Architecture guard
        run: python3 scripts/check_architecture.py

      - name: Docs drift guard
        run: python3 scripts/check_docs_drift.py

      - name: Test layout guard
        run: python3 scripts/check_test_layout.py

      - name: Migration hygiene guard
        run: python3 scripts/check_migrations.py

      # Version is declared three times (CMakeLists / conanfile / pay-admin);
      # catching the drift here means a tagged release never discovers that a
      # PR could have fixed it.
      - name: Version sync guard
        run: python3 scripts/check_version_sync.py

      # Two halves of one gate, split so a stale spec and a stale exclusion
      # list produce different failing step names. The checker parses a
      # YAML subset with the stdlib only: GitHub's ubuntu runners ship
      # PyYAML today, but a third-party runner without it must not be able
      # to turn a documentation gate into a red build.
      - name: OpenAPI contract lint
        run: python3 scripts/check_openapi_routes.py --lint-only

      - name: OpenAPI route parity
        run: python3 scripts/check_openapi_routes.py --routes-only

      # Hard gate: format-the-tree commit resolved all pre-existing drift.
      # models/ is generated code and excluded (same scope as
      # .clang-format-ignore). Version pin lives in
      # scripts/clang_format.py (PINNED_MAJOR), not in this workflow.
      - name: clang-format check
        env:
          CLANG_FORMAT_BIN: clang-format-22
        run: python3 scripts/clang_format.py --check

      - name: Emoji detection
        run: |
          echo "Checking for emoji in source files..."
          if grep -rPn '[\x{1F000}-\x{1FFFF}]' libs/ examples/pay-server/ tests/ --include='*.h' --include='*.cc'; then
            echo "ERROR: Emoji found in source files"
            exit 1
          fi
          echo "No emoji found."

      - name: Hardcoded secrets detection
        run: |
          echo "Checking for hardcoded secrets..."
          if grep -rn -E '(passwd|password|secret)\s*[:=]\s*"[^_${}][^"]{2,}"' libs/ examples/pay-server/ tests/ \
               --include='*.h' --include='*.cc' --include='*.json' \
               | grep -v '__env_var' | grep -v '.example' | grep -v 'test_key_'; then
            echo "ERROR: Possible hardcoded secret found"
            exit 1
          fi
          echo "No hardcoded secrets found."

      - name: CoroMapper usage detection
        run: |
          echo "Checking for CoroMapper usage (excluding auto-generated ORM models)..."
          if grep -rn 'CoroMapper' libs/ examples/pay-server/ tests/ --include='*.h' --include='*.cc' --exclude-dir=models; then
            echo "ERROR: CoroMapper usage detected outside models/"
            exit 1
          fi
          echo "No CoroMapper usage found outside models/."

      - name: Old Plugin API detection
        run: |
          echo "Checking for old Plugin API usage in tests..."
          if grep -rn 'plugin.*->.*method.*req.*callback' tests/ --include='*.cc'; then
            echo "ERROR: Old Plugin API usage detected in tests"
            exit 1
          fi
          echo "No old Plugin API usage found."

  # --- FAST gate, parallel ----------------------------------------------------
  # Two-tier clang-tidy policy (see scripts/clang_tidy_gate.py): .clang-tidy
  # stays advisory for agents/devs; this job enforces the PROMOTED_CHECKS
  # batch as a HARD gate via --warnings-as-errors. Configure-only: tidy parses
  # sources straight from compile_commands.json, no object build.
  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Conan
        run: |
          pip install conan
          conan profile detect --force

      - name: Cache Conan packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.conan2/p
          key: ${{ runner.os }}-conan2-${{ hashFiles('conanfile.py', 'conan.lock') }}
          restore-keys: |
            ${{ runner.os }}-conan2-

      - name: Install dependencies (Conan)
        run: conan install . --output-folder=build/linux-release -s build_type=${{env.BUILD_TYPE}} -s compiler.cppstd=17 --build=missing

      - name: Configure (cmake --preset, no build)
        run: cmake --preset linux-release

      # Same apt.llvm.org repo and major as the clang-format-22 install in
      # static-analysis, so local gate measurements and CI see one check set.
      - name: Install clang-tidy-22
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/llvm.gpg
          echo "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-22 main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y clang-tidy-22

      - name: clang-tidy hard gate (promoted checks)
        env:
          CLANG_TIDY_BIN: clang-tidy-22
        run: python3 scripts/clang_tidy_gate.py

  # --- MAIN gate --------------------------------------------------------------
  build-test:
    name: ${{ matrix.check_name }}
    needs: [static-analysis, clang-tidy]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runs_on: ubuntu-22.04
            cmake_preset: linux-release
            preset_dir: build/linux-release
            configure_extra_args: "-DDROGON_PAY_WERROR=ON"
            use_database: true
            ctest_timeout: 120
            timeout_minutes: 90
            check_name: linux-build-and-test
            log_artifact_name: linux-test-logs
          - platform: windows
            runs_on: windows-2022
            cmake_preset: windows-msvc
            preset_dir: build/windows-msvc
            configure_extra_args: "-DDROGON_PAY_WERROR=ON"
            use_database: true
            ctest_timeout: 180
            timeout_minutes: 120
            check_name: windows-build-and-test
            log_artifact_name: windows-test-logs
          - platform: macos
            runs_on: macos-14
            cmake_preset: macos-arm64
            preset_dir: build/macos-arm64
            conan_extra_settings: "-s arch=armv8"
            configure_extra_args: "-DDROGON_PAY_WERROR=ON"
            # Build-only, and that is the environment deciding, not a shortcut:
            # the macos-14 image is past Homebrew's support window, so it has no
            # bottles, so `brew install postgresql@15 redis` compiles from source
            # and drags llvm@22 + rust in as Redis dependencies. The leg spent its
            # whole 120-minute allowance inside brew and never reached the suite.
            # What this leg must prove is the arm64 clang `-Werror` compile (the
            # only compiler that reports -Wunused-lambda-capture); the name this
            # leg reports under, `macos-build / build-test`, says exactly that, and
            # the runtime suite is covered on the two platforms that can stand a
            # database up.
            use_database: false
            ctest_timeout: 180
            timeout_minutes: 90
            check_name: macos-build
            log_artifact_name: macos-test-logs
    uses: ./.github/workflows/_build-test.yml
    with:
      platform: ${{ matrix.platform }}
      runs_on: ${{ matrix.runs_on }}
      cmake_preset: ${{ matrix.cmake_preset }}
      preset_dir: ${{ matrix.preset_dir }}
      build_type: Release
      conan_extra_settings: ${{ matrix.conan_extra_settings }}
      configure_extra_args: ${{ matrix.configure_extra_args }}
      use_database: ${{ matrix.use_database }}
      ctest_timeout: ${{ matrix.ctest_timeout }}
      timeout_minutes: ${{ matrix.timeout_minutes }}
      log_artifact_name: ${{ matrix.log_artifact_name }}

  # --- RELEASE gate -----------------------------------------------------------
  sdk-smoke:
    name: ${{ matrix.check_name }}
    needs: build-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runs_on: ubuntu-22.04
            check_name: sdk-smoke-linux
          - platform: windows
            runs_on: windows-2022
            check_name: sdk-smoke-windows
    uses: ./.github/workflows/_sdk-smoke.yml
    with:
      platform: ${{ matrix.platform }}
      runs_on: ${{ matrix.runs_on }}
      timeout_minutes: 120
