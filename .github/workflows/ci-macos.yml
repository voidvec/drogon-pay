name: macOS CI

# MIGRATION WINDOW: superseded by ci.yml + _build-test.yml. Both pipelines run
# side by side until ci.yml has produced one fully green run on the same commit
# as this file; then this workflow is deleted. The legacy build-Drogon-from-
# source rollback job moved out to legacy-source-build.yml (dispatch-only).
on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  # Primary path: Conan-managed dependencies + CMake presets, mirroring the
  # Windows/Linux CI and local developer workflow. Build-only (no databases),
  # same coverage as the legacy job.
  build-and-test:
    name: macos-build
    runs-on: macos-14
    # Cold Conan cache builds drogon/openssl from source, which can take a while
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Install Conan
        run: |
          brew update
          brew install conan
          conan profile detect --force

      # --- Conan dependency cache ---
      # Same policy as ci-windows.yml: cache the package store so drogon and
      # friends are only rebuilt from source when the lockfile changes.
      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: ${{ runner.os }}-conan2-${{ hashFiles('conanfile.py', 'conan.lock') }}
          restore-keys: |
            ${{ runner.os }}-conan2-

      - name: Install dependencies (Conan)
        run: conan install . --output-folder=build/macos-arm64 -s build_type=${{env.BUILD_TYPE}} -s compiler.cppstd=17 -s arch=armv8 --build=missing

      - name: Configure (cmake --preset)
        run: cmake --preset macos-arm64 -DDROGON_PAY_WERROR=ON

      - name: Build (cmake --build --preset)
        run: cmake --build --preset macos-arm64 -j $(sysctl -n hw.ncpu)

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-test-logs
          path: |
            ${{github.workspace}}/build/macos-arm64/Testing/
            ${{github.workspace}}/logs/
          retention-days: 7
