version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: pay_postgres
    environment:
      POSTGRES_DB: pay_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # SQL migrations live at the repository root after the plugin refactor.
      # The image entrypoint runs every *.sql in filename order while
      # initialising a *virgin* data directory, so this volume is a bootstrap
      # convenience, not a migration runner: it also executes
      # 000_drop_pay_tables.sql (a no-op on a fresh cluster), and it writes no
      # schema_migrations rows. Therefore the first migrate_db.py run against a
      # compose-provisioned database must adopt that state explicitly:
      #   python scripts/migrate_db.py --baseline
      # which refuses to record anything unless the tables really exist.
      # To replay the chain instead of adopting it, drop the volume
      # (`docker compose down -v`) and let migrate_db.py apply the versions.
      - ../../sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pay_network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: pay_redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - pay_network

  # Pay Server Application
  payserver:
    build:
      # The Dockerfile needs libs/drogon-pay and examples/pay-server, so the
      # build context must be the repository root (see Dockerfile header).
      context: ../..
      dockerfile: examples/pay-server/Dockerfile
    container_name: pay_server
    ports:
      - "5566:5566"
    environment:
      # Secrets MUST be supplied via the environment (P5). The :? syntax makes
      # docker-compose refuse to start if they are unset, so a production
      # deploy can never silently fall back to a weak/default key. For local
      # dev, copy .env.development.example to .env (gitignored) and export
      # these vars, or set them inline: PAY_API_KEY=dev-only-key docker-compose up
      - PAY_DB_PASSWORD=${PAY_DB_PASSWORD:?set PAY_DB_PASSWORD}
      - PAY_REDIS_PASSWORD=${PAY_REDIS_PASSWORD:-}
      - PAY_API_KEY=${PAY_API_KEY:?set PAY_API_KEY (use a strong key; never the dev test_key_123456)}
    volumes:
      - ./config.json:/app/config.json:ro
      - ./certs:/app/certs:ro
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5566/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - pay_network
    restart: unless-stopped

  # Prometheus Monitoring (optional)
  prometheus:
    image: prom/prometheus:latest
    container_name: pay_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - pay_network
    profiles:
      - monitoring

  # Grafana Dashboard (optional)
  grafana:
    image: grafana/grafana:latest
    container_name: pay_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana-dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - pay_network
    profiles:
      - monitoring

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  pay_network:
    driver: bridge
